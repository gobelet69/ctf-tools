<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hidden Character Viewer - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Hidden Character Viewer</h1>
<p class="note">Reveal zero-width and invisible characters</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('hidden-chars');
  

  const input = $('#input');
  const output = $('#output');
  
  $('#btn-process').onclick = () => {
    const map = {
      '\u200b': '[ZWSP]', '\u200c': '[ZWNJ]', '\u200d': '[ZWJ]',
      '\u200e': '[LTR]', '\u200f': '[RTL]', '\u00a0': '[NBSP]',
      '\r': '[\r]', '\n': '[\n]\n', '\t': '[\t]'
    };
    output.value = Array.from(input.value).map(c => map[c] || c).join('');
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; input.focus(); };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
