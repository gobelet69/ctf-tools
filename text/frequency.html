<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Character Frequency - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Character Frequency</h1>
<p class="note">Count character frequencies</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('char-freq');
  

  const input = $('#input');
  const output = $('#output');
  
  $('#btn-process').onclick = () => {
    const text = input.value;
    const counts = {};
    for(let i=0; i<text.length; i++) {
      const c = text[i];
      counts[c] = (counts[c] || 0) + 1;
    }
    const sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
    let res = `Total characters: ${text.length}\n\nChar | Count | %\n-----|-------|----\n`;
    sorted.forEach(c => {
      const pct = (counts[c] / text.length * 100).toFixed(2);
      const disp = c === ' ' ? '[Space]' : c === '\n' ? '[\n]' : c;
      res += `${disp.padEnd(4)} | ${counts[c].toString().padEnd(5)} | ${pct}%\n`;
    });
    output.value = res;
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; input.focus(); };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
