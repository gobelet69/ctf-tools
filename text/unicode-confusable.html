<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unicode Confusable Inspector - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Unicode Confusable Inspector</h1>
<p class="note">Detect Unicode lookalikes and homoglyphs</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('unicode-confusable');
  

  const input = $('#input');
  const output = $('#output');
  $('#btn-process').onclick = () => {
    const text = input.value;
    let res = '';
    for(let i=0; i<text.length; i++) {
      const code = text.charCodeAt(i);
      // ASCII is safe
      if(code >= 32 && code <= 126) continue;
      
      const hex = code.toString(16).toUpperCase().padStart(4, '0');
      res += `Char: ${text[i]} (U+${hex}) at index ${i}\n`;
      if(code === 0x200B) res += ` -> Zero-width space (ZWSP)\n`;
      if(code === 0x0430) res += ` -> Cyrillic 'a' (Looks like Latin 'a')\n`;
      if(code === 0x0435) res += ` -> Cyrillic 'e' (Looks like Latin 'e')\n`;
      if(code === 0x039F) res += ` -> Greek Omicron (Looks like Latin 'O')\n`;
      // Extremely basic confusable logic for triage
    }
    output.value = res || 'No obvious non-ASCII or confusable characters detected.';
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
