<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rail Fence Cipher - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Rail Fence Cipher</h1>
<p class="note">Encrypt and decrypt transposition</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('rail-fence');
  

  const input = $('#input');
  const output = $('#output');
  const tb = $$('.toolbar')[0];
  tb.innerHTML = 'Rails: <input type="number" id="rails" value="3" style="width:60px"> ';
  const encBtn = makeEl('button', {class:'primary'}, 'Encrypt');
  const decBtn = makeEl('button', {}, 'Decrypt');
  tb.appendChild(encBtn); tb.appendChild(decBtn);
  
  encBtn.onclick = () => {
    $('#error').textContent = '';
    const text = input.value;
    const num = parseInt($('#rails').value);
    if(num < 2) return $('#error').textContent = 'Rails must be >= 2';
    
    let rails = Array.from({length: num}, () => []);
    let dir = -1, row = 0;
    
    for(let i=0; i<text.length; i++) {
      rails[row].push(text[i]);
      if(row === 0 || row === num-1) dir *= -1;
      row += dir;
    }
    output.value = rails.map(r => r.join('')).join('');
  };
  
  decBtn.onclick = () => {
    $('#error').textContent = '';
    const text = input.value;
    const num = parseInt($('#rails').value);
    if(num < 2) return $('#error').textContent = 'Rails must be >= 2';
    
    let mark = Array.from({length: num}, () => Array(text.length).fill(null));
    let dir = -1, row = 0;
    
    for(let i=0; i<text.length; i++) {
      mark[row][i] = '*';
      if(row === 0 || row === num-1) dir *= -1;
      row += dir;
    }
    
    let idx = 0;
    for(let r=0; r<num; r++) {
      for(let c=0; c<text.length; c++) {
        if(mark[r][c] === '*' && idx < text.length) {
          mark[r][c] = text[idx++];
        }
      }
    }
    
    let res = '';
    dir = -1; row = 0;
    for(let i=0; i<text.length; i++) {
      res += mark[row][i];
      if(row === 0 || row === num-1) dir *= -1;
      row += dir;
    }
    output.value = res;
  };
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
