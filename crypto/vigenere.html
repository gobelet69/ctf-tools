<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vigenère Cipher - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Vigenère Cipher</h1>
<p class="note">Encrypt and decrypt with Vigenère cipher</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('vigenere');
  

  const input = $('#input');
  const output = $('#output');
  
  const tb = $$('.toolbar')[0];
  tb.innerHTML = '<input type="text" id="key" placeholder="Key (e.g. SECRET)" style="width:150px"> ';
  const encBtn = makeEl('button', {class: 'primary'}, 'Encrypt');
  const decBtn = makeEl('button', {}, 'Decrypt');
  tb.appendChild(encBtn); tb.appendChild(decBtn);
  
  function process(str, key, decrypt) {
    key = key.toUpperCase().replace(/[^A-Z]/g, '');
    if(!key) return str;
    let res = '', ki = 0;
    for(let i=0; i<str.length; i++) {
      const c = str[i];
      if(/[a-zA-Z]/.test(c)) {
        const isUpper = c <= 'Z';
        const offset = isUpper ? 65 : 97;
        const shift = key.charCodeAt(ki % key.length) - 65;
        const actualShift = decrypt ? (26 - shift) : shift;
        res += String.fromCharCode(((c.charCodeAt(0) - offset + actualShift) % 26) + offset);
        ki++;
      } else res += c;
    }
    return res;
  }
  
  encBtn.onclick = () => output.value = process(input.value, $('#key').value, false);
  decBtn.onclick = () => output.value = process(input.value, $('#key').value, true);
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
