<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Affine Cipher - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Affine Cipher</h1>
<p class="note">Encrypt and decrypt with affine cipher</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('affine');
  

  const input = $('#input');
  const output = $('#output');
  const tb = $$('.toolbar')[0];
  tb.innerHTML = 'A: <input type="number" id="a" value="5" style="width:60px"> B: <input type="number" id="b" value="8" style="width:60px"> ';
  const encBtn = makeEl('button', {class:'primary'}, 'Encrypt');
  const decBtn = makeEl('button', {}, 'Decrypt');
  tb.appendChild(encBtn); tb.appendChild(decBtn);
  
  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function modInverse(a, m) {
    for(let x=1; x<m; x++) if((a * x) % m === 1) return x;
    return -1;
  }
  
  encBtn.onclick = () => {
    $('#error').textContent = '';
    const a = parseInt($('#a').value), b = parseInt($('#b').value);
    if(gcd(a, 26) !== 1) return $('#error').textContent = 'A must be coprime to 26';
    
    output.value = input.value.replace(/[a-zA-Z]/g, c => {
      const base = c <= 'Z' ? 65 : 97;
      const x = c.charCodeAt(0) - base;
      return String.fromCharCode(((a * x + b) % 26) + base);
    });
  };
  
  decBtn.onclick = () => {
    $('#error').textContent = '';
    const a = parseInt($('#a').value), b = parseInt($('#b').value);
    const aInv = modInverse(a, 26);
    if(aInv === -1) return $('#error').textContent = 'A must be coprime to 26';
    
    output.value = input.value.replace(/[a-zA-Z]/g, c => {
      const base = c <= 'Z' ? 65 : 97;
      const x = c.charCodeAt(0) - base;
      return String.fromCharCode(((aInv * (x - b + 26)) % 26) + base);
    });
  };
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
