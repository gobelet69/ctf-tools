<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Euler Totient (φ) - CTF Tools</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../style.css"></head>
<body><nav><a href="../index.html">&larr; Back to Tools</a></nav><h1>Euler Totient (φ)</h1><p class="note">Calculate Euler phi function</p>
<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    <div class="toolbar"><button id="btn-process" class="primary">Process</button><button id="btn-clear">Clear</button></div>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    <div class="toolbar"><button id="btn-copy">Copy</button><button id="btn-swap">Output &rarr; Input</button></div>
  </div>
</div>
<script src="../js/common.js"></script><script>trackUsage('euler-phi');

  $('#btn-process').onclick = () => {
    $('#error').textContent = '';
    try {
      let n = BigInt($('#input').value.trim());
      let res = n;
      // extremely basic trial division for small numbers. This will hang on big primes.
      // We will bound it strictly to avoid hanging the browser.
      if(n > 1000000000n) throw new Error('Number too large for browser-based factorization triage');
      
      for (let p = 2n; p * p <= n; p++) {
        if (n % p === 0n) {
          while (n % p === 0n) n /= p;
          res -= res / p;
        }
      }
      if (n > 1n) res -= res / n;
      $('#output').value = `φ = ${res}`;
    } catch(e) { $('#error').textContent = e.message; }
  };
  $('#btn-clear').onclick = () => $('#input').value = $('#output').value = '';
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => $('#output').value);
</script></body></html>
