<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTML Entities Encode / Decode - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>HTML Entities Encode / Decode</h1>
<p class="note">Encode and decode HTML entities</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('html-entities');
  

  const input = $('#input');
  const output = $('#output');
  const err = $('#error');
  
  const tb = $$('.toolbar')[0];
  tb.innerHTML = '';
  const encBtn = makeEl('button', {class: 'primary'}, 'Encode');
  const decBtn = makeEl('button', {}, 'Decode');
  const clrBtn = makeEl('button', {}, 'Clear');
  tb.appendChild(encBtn); tb.appendChild(decBtn); tb.appendChild(clrBtn);
  
  encBtn.onclick = () => {
    err.textContent = '';
    const el = document.createElement('div');
    el.textContent = input.value;
    output.value = el.innerHTML;
  };
  
  decBtn.onclick = () => {
    err.textContent = '';
    const el = document.createElement('textarea');
    el.innerHTML = input.value;
    output.value = el.value;
  };
  
  clrBtn.onclick = () => { input.value = output.value = err.textContent = ''; input.focus(); };
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = err.textContent = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
