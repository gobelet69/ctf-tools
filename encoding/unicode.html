<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Unicode Inspector - CTF Tools</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../style.css"></head>
<body><nav><a href="../index.html">&larr; Back to Tools</a></nav><h1>Unicode Inspector</h1><p class="note">Inspect Unicode code points</p>
<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    <div class="toolbar"><button id="btn-process" class="primary">Process</button><button id="btn-clear">Clear</button></div>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    <div class="toolbar"><button id="btn-copy">Copy</button><button id="btn-swap">Output &rarr; Input</button></div>
  </div>
</div>
<script src="../js/common.js"></script><script>trackUsage('unicode');

  $('#btn-process').onclick = () => {
    const text = $('#input').value;
    let res = '';
    for(let i=0; i<text.length; i++) {
      const code = text.charCodeAt(i);
      const hex = code.toString(16).toUpperCase().padStart(4, '0');
      res += `${text[i]}  ->  U+${hex}  (Dec: ${code})\n`;
    }
    $('#output').value = res;
  };
  $('#btn-clear').onclick = () => $('#input').value = $('#output').value = '';
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => $('#output').value);
</script></body></html>
