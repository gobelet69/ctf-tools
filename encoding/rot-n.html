<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ROT-N / Caesar - CTF Tools</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../style.css"></head>
<body><nav><a href="../index.html">&larr; Back to Tools</a></nav><h1>ROT-N / Caesar</h1><p class="note">Apply arbitrary rotation</p>
<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    <div class="toolbar"><button id="btn-process" class="primary">Process</button><button id="btn-clear">Clear</button></div>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    <div class="toolbar"><button id="btn-copy">Copy</button><button id="btn-swap">Output &rarr; Input</button></div>
  </div>
</div>
<script src="../js/common.js"></script><script>trackUsage('rot-n');

  const tb = $$('.toolbar')[0];
  tb.innerHTML = '<input type="number" id="shift" value="13" style="width:80px"> <button id="btn-process" class="primary">Shift</button> <button id="btn-clear">Clear</button>';
  $('#btn-process').onclick = () => {
    let s = parseInt($('#shift').value) || 0;
    s = (s % 26 + 26) % 26;
    $('#output').value = $('#input').value.replace(/[a-zA-Z]/g, c => {
      const b = c <= 'Z' ? 65 : 97;
      return String.fromCharCode(((c.charCodeAt(0) - b + s) % 26) + b);
    });
  };
  $('#btn-clear').onclick = () => $('#input').value = $('#output').value = '';
  $('#btn-swap').onclick = () => { if($('#output').value) { $('#input').value = $('#output').value; $('#output').value = ''; } };
  addCopyButton($('#btn-copy'), () => $('#output').value);
</script></body></html>
