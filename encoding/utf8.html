<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>UTF-8 Encode / Decode - CTF Tools</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../style.css"></head>
<body><nav><a href="../index.html">&larr; Back to Tools</a></nav><h1>UTF-8 Encode / Decode</h1><p class="note">Encode/decode UTF-8</p>
<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    <div class="toolbar"><button id="btn-process" class="primary">Process</button><button id="btn-clear">Clear</button></div>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    <div class="toolbar"><button id="btn-copy">Copy</button><button id="btn-swap">Output &rarr; Input</button></div>
  </div>
</div>
<script src="../js/common.js"></script><script>trackUsage('utf8');

  const tb = $$('.toolbar')[0];
  tb.innerHTML = '<button id="btn-enc" class="primary">Text &rarr; Hex Bytes</button> <button id="btn-dec" class="primary">Hex Bytes &rarr; Text</button> <button id="btn-clear">Clear</button>';
  $('#btn-enc').onclick = () => {
    $('#error').textContent = '';
    $('#output').value = bytesToHex(new TextEncoder().encode($('#input').value), ' ');
  };
  $('#btn-dec').onclick = () => {
    $('#error').textContent = '';
    try {
      $('#output').value = new TextDecoder().decode(hexToBytes($('#input').value));
    } catch(e) { $('#error').textContent = 'Invalid hex bytes'; }
  };
  $('#btn-clear').onclick = () => $('#input').value = $('#output').value = '';
  $('#btn-swap').onclick = () => { if($('#output').value) { $('#input').value = $('#output').value; $('#output').value = ''; } };
  addCopyButton($('#btn-copy'), () => $('#output').value);
</script></body></html>
