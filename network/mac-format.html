<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MAC Address Formatter - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>MAC Address Formatter</h1>
<p class="note">Format MAC addresses in various styles</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('mac-format');
  

  const input = $('#input');
  const output = $('#output');
  $('#btn-process').onclick = () => {
    let mac = input.value.replace(/[^0-9a-fA-F]/g, '').toUpperCase();
    if(mac.length !== 12) return $('#error').textContent = 'Invalid MAC (need 12 hex digits)';
    $('#error').textContent = '';
    
    const p2 = mac.match(/.{1,2}/g);
    const p4 = mac.match(/.{1,4}/g);
    
    output.value = `Standard: ${p2.join(':')}\nDash:     ${p2.join('-')}\nCisco:    ${p4.join('.').toLowerCase()}\nRaw:      ${mac}`;
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
