<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Known-Plaintext XOR - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Known-Plaintext XOR</h1>
<p class="note">Recover XOR key</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('known-plaintext-xor');
  

  const input = $('#input');
  input.placeholder = "Hex ciphertext";
  const output = $('#output');
  const tb = $$('.toolbar')[0];
  tb.innerHTML = '<input type="text" id="pt" placeholder="Known Plaintext" style="width:150px"> ';
  tb.appendChild(makeEl('button', {class:'primary', id:'btn-xor'}, 'Recover Key'));
  
  $('#btn-xor').onclick = () => {
    try {
      const ct = hexToBytes(input.value);
      const pt = textToBytes($('#pt').value);
      if(pt.length > ct.length) return $('#error').textContent = 'Plaintext longer than ciphertext';
      
      const key = new Uint8Array(pt.length);
      for(let i=0; i<pt.length; i++) key[i] = ct[i] ^ pt[i];
      
      output.value = `[ HEX KEY ]\n${bytesToHex(key)}\n\n[ ASCII KEY ]\n${bytesToAscii(key)}`;
      $('#error').textContent = '';
    } catch(e) { $('#error').textContent = 'Error: Check hex format'; }
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
