<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Repeating-Key XOR - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Repeating-Key XOR</h1>
<p class="note">XOR with a repeating key</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('repeating-key-xor');
  

  const input = $('#input');
  input.placeholder = "Hex ciphertext or plaintext text";
  const output = $('#output');
  
  const tb = $$('.toolbar')[0];
  tb.innerHTML = '<input type="text" id="key" placeholder="Key (Text)" style="width:150px"> ';
  tb.appendChild(makeEl('button', {class:'primary', id:'btn-xor'}, 'XOR'));
  
  $('#btn-xor').onclick = () => {
    $('#error').textContent = '';
    const key = textToBytes($('#key').value);
    if(key.length === 0) return $('#error').textContent = 'Key required';
    
    // detect hex
    let data;
    if(/^[0-9a-fA-F\s]+$/.test(input.value) && input.value.replace(/\s/g,'').length % 2 === 0) {
      data = hexToBytes(input.value);
    } else {
      data = textToBytes(input.value);
    }
    
    const out = new Uint8Array(data.length);
    for(let i=0; i<data.length; i++) out[i] = data[i] ^ key[i % key.length];
    
    output.value = `[ HEX ]\n${bytesToHex(out)}\n\n[ ASCII ]\n${bytesToAscii(out).replace(/[^\x20-\x7E]/g,'.')}`;
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; };
  $('#btn-swap').onclick = () => { 
    if(output.value) { 
      const hex = output.value.match(/\[ HEX \]\n([^\n]+)/);
      if(hex) input.value = hex[1];
      output.value = '';
    }
  };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
