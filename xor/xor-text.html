<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XOR Text with Key - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>XOR Text with Key</h1>
<p class="note">XOR plaintext with a text key</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('xor-text');
  

  const input = $('#input');
  input.placeholder = "Data to XOR";
  const output = $('#output');
  const err = $('#error');
  
  const tb = $$('.toolbar')[0];
  tb.innerHTML = '<input type="text" id="key" placeholder="Key (Text)" style="width:200px"> ';
  const xorBtn = makeEl('button', {class: 'primary'}, 'XOR');
  tb.appendChild(xorBtn);
  
  xorBtn.onclick = () => {
    err.textContent = '';
    const keyText = $('#key').value;
    if(!keyText) { err.textContent = 'Enter a key'; return; }
    
    const dataBytes = textToBytes(input.value);
    const keyBytes = textToBytes(keyText);
    const out = new Uint8Array(dataBytes.length);
    for(let i=0; i<dataBytes.length; i++) {
      out[i] = dataBytes[i] ^ keyBytes[i % keyBytes.length];
    }
    output.value = bytesToHex(out);
  };
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = err.textContent = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
