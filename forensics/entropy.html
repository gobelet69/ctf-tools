<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Entropy Analyzer - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Entropy Analyzer</h1>
<p class="note">Calculate Shannon entropy of data</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('entropy');
  

  const input = $('#input');
  const output = $('#output');
  
  $('#btn-process').onclick = () => {
    if(!input.value) return output.value = '';
    const ent = shannonEntropy(textToBytes(input.value));
    let interp = 'Low (likely plaintext)';
    if(ent > 4.5) interp = 'Medium';
    if(ent > 7) interp = 'High (likely compressed/encrypted)';
    output.value = `Entropy: ${ent.toFixed(4)} bits/byte\n\nInterpretation: ${interp}`;
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; input.focus(); };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
