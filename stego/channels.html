<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Color Channel Splitter - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Color Channel Splitter</h1>
<p class="note">Separate RGB and Alpha channels</p>


<div class="grid" style="margin-top: 1rem;">
  <div class="card">
    <label>Select Image</label>
    <input type="file" id="file" accept="image/png, image/jpeg, image/bmp, image/webp" />
    <div id="controls" style="margin-top:1rem; display:none;">
      <select id="chan-sel"><option value="R">Red</option><option value="G">Green</option><option value="B">Blue</option><option value="A">Alpha (Grayscale mapping)</option></select>
    </div>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label>Result Viewer</label>
    <div style="border:1px solid var(--border); border-radius:4px; overflow:auto; max-height:600px; background:var(--surface);">
      <canvas id="canvas" style="display:block; margin:0 auto; max-width:100%;"></canvas>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('channels');
  

  const fileIn = $('#file');
  const canvas = $('#canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  const err = $('#error');
  const controls = $('#controls');
  let originalImage = null;
  
  fileIn.onchange = () => {
    err.textContent = '';
    const f = fileIn.files[0];
    if(!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      if(img.width * img.height > 10000000) { err.textContent = 'Image too large for quick canvas triage (limit ~10MP).'; return; }
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      originalImage = ctx.getImageData(0, 0, img.width, img.height);
      controls.style.display = 'block';
      if(typeof onImageLoad === 'function') onImageLoad();
    };
    img.onerror = () => err.textContent = 'Invalid image';
    img.src = url;
  };
  

  const chanSel = $('#chan-sel');
  
  function process() {
    if(!originalImage) return;
    const out = ctx.createImageData(canvas.width, canvas.height);
    const mode = chanSel.value;
    
    for(let i=0; i<originalImage.data.length; i+=4) {
      if(mode === 'R') { out.data[i]=originalImage.data[i]; out.data[i+1]=0; out.data[i+2]=0; }
      if(mode === 'G') { out.data[i]=0; out.data[i+1]=originalImage.data[i+1]; out.data[i+2]=0; }
      if(mode === 'B') { out.data[i]=0; out.data[i+1]=0; out.data[i+2]=originalImage.data[i+2]; }
      if(mode === 'A') { const a = originalImage.data[i+3]; out.data[i]=a; out.data[i+1]=a; out.data[i+2]=a; }
      out.data[i+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }
  
  window.onImageLoad = process;
  chanSel.onchange = process;

</script>
</body>
</html>
