<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Image Inspector - CTF Tools</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../style.css"></head>
<body><nav><a href="../index.html">&larr; Back to Tools</a></nav><h1>Image Inspector</h1><p class="note">Dimensions, format, color info</p>

<div class="grid" style="margin-top: 1rem;">
  <div class="card">
    <label>Select Image</label>
    <input type="file" id="file" accept="image/*" />
    <div id="error" class="error"></div>
  </div>
  <div>
    <label>Image Metadata</label>
    <textarea id="output" rows="8" readonly></textarea>
  </div>
</div>

<script src="../js/common.js"></script><script>trackUsage('image-meta');

  const fileIn = $('#file');
  const output = $('#output');
  fileIn.onchange = () => {
    const f = fileIn.files[0];
    if(!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      output.value = `Filename:   ${f.name}\nSize:       ${f.size} bytes\nMIME Type:  ${f.type}\n\nDimensions: ${img.width} x ${img.height} pixels\nTotal Px:   ${img.width * img.height}`;
    };
    img.onerror = () => { $('#error').textContent = 'Invalid image'; };
    img.src = url;
  };
</script></body></html>
