<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trailing Data Detector - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Trailing Data Detector</h1>
<p class="note">Find data appended after image end markers</p>


<div class="grid" style="margin-top: 1rem;">
  <div class="card">
    <label>Select File</label>
    <input type="file" id="file" />
    <div id="error" class="error"></div>
  </div>
  <div>
    <label>Trailing Data (Hex + ASCII)</label>
    <textarea id="output" rows="12" readonly style="font-family:var(--mono)"></textarea>
    <div class="toolbar"><button id="btn-copy">Copy</button></div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('trailing-data');
  

  const fileIn = $('#file');
  const output = $('#output');
  const err = $('#error');
  
  fileIn.onchange = async () => {
    err.textContent = '';
    const f = fileIn.files[0];
    if(!f) return;
    try {
      const b = await readFile(f);
      let offset = -1;
      
      // JPEG EOI FF D9
      if(b[0]===0xFF && b[1]===0xD8) {
        for(let i=b.length-2; i>=0; i--) {
          if(b[i]===0xFF && b[i+1]===0xD9) { offset = i+2; break; }
        }
      }
      // PNG IEND
      else if(b[0]===0x89 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47) {
        for(let i=0; i<b.length-8; i++) {
          if(b[i]===0x49 && b[i+1]===0x45 && b[i+2]===0x4E && b[3]===0x44) {
            offset = i + 8; // IEND + CRC (4 bytes)
            break;
          }
        }
      }
      
      if(offset === -1 || offset >= b.length) {
        output.value = 'No trailing data detected after known end markers.';
        return;
      }
      
      const trailing = b.slice(offset);
      let res = `Detected ${trailing.length} bytes of trailing data at offset 0x${offset.toString(16).toUpperCase()}\n\n`;
      const hex = bytesToHex(trailing);
      const asc = bytesToAscii(trailing).replace(/[^\x20-\x7E]/g, '.');
      res += '[ HEX ]\n' + hex + '\n\n[ ASCII ]\n' + asc;
      output.value = res;
    } catch(e) { err.textContent = 'Error reading file'; }
  };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
