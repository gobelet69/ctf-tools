<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cookie Parser - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Cookie Parser</h1>
<p class="note">Parse and inspect HTTP cookies</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('cookie-parser');
  

  const input = $('#input');
  input.placeholder = "cookie1=value; cookie2=value...";
  const output = $('#output');
  
  $('#btn-process').onclick = () => {
    try {
      const parts = input.value.split(';');
      let res = '';
      parts.forEach(p => {
        const [k, ...v] = p.trim().split('=');
        if(k) res += `${k} = ${decodeURIComponent(v.join('='))}\n`;
      });
      output.value = res;
    } catch(e) { $('#error').textContent = 'Parse error'; }
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; input.focus(); };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
