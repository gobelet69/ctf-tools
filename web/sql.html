<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SQL Formatter - CTF Tools</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../style.css"></head>
<body><nav><a href="../index.html">&larr; Back to Tools</a></nav><h1>SQL Formatter</h1><p class="note">Basic SQL query formatter</p>
<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    <div class="toolbar"><button id="btn-process" class="primary">Process</button><button id="btn-clear">Clear</button></div>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    <div class="toolbar"><button id="btn-copy">Copy</button><button id="btn-swap">Output &rarr; Input</button></div>
  </div>
</div>
<script src="../js/common.js"></script><script>trackUsage('sql-format');

  $('#btn-process').onclick = () => {
    let sql = $('#input').value.replace(/\s+/g, ' ');
    const keywords = ['SELECT','FROM','WHERE','AND','OR','ORDER BY','GROUP BY','HAVING','LIMIT','JOIN','LEFT JOIN','INNER JOIN','RIGHT JOIN','UNION','INSERT INTO','VALUES','UPDATE','SET','DELETE'];
    keywords.forEach(kw => {
      const re = new RegExp(`\\b${kw}\\b`, 'gi');
      sql = sql.replace(re, `\n${kw.toUpperCase()}`);
    });
    $('#output').value = sql.trim();
  };
  $('#btn-clear').onclick = () => $('#input').value = $('#output').value = '';
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => $('#output').value);
</script></body></html>
