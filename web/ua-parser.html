<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>User-Agent Parser - CTF Tools</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../style.css"></head>
<body><nav><a href="../index.html">&larr; Back to Tools</a></nav><h1>User-Agent Parser</h1><p class="note">Parse User-Agent strings</p>
<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    <div class="toolbar"><button id="btn-process" class="primary">Process</button><button id="btn-clear">Clear</button></div>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    <div class="toolbar"><button id="btn-copy">Copy</button><button id="btn-swap">Output &rarr; Input</button></div>
  </div>
</div>
<script src="../js/common.js"></script><script>trackUsage('ua-parser');

  $('#btn-process').onclick = () => {
    const ua = $('#input').value;
    let os = 'Unknown', browser = 'Unknown';
    if(ua.includes('Windows')) os = 'Windows';
    else if(ua.includes('Mac OS')) os = 'macOS';
    else if(ua.includes('Linux')) os = 'Linux';
    else if(ua.includes('Android')) os = 'Android';
    else if(ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
    
    if(ua.includes('Firefox')) browser = 'Firefox';
    else if(ua.includes('Edg')) browser = 'Edge';
    else if(ua.includes('Chrome')) browser = 'Chrome';
    else if(ua.includes('Safari')) browser = 'Safari';
    
    $('#output').value = `OS: ${os}\nBrowser: ${browser}\n\nRaw: ${ua}`;
  };
  $('#btn-clear').onclick = () => $('#input').value = $('#output').value = '';
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => $('#output').value);
</script></body></html>
