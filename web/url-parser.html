<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>URL Parser - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>URL Parser</h1>
<p class="note">Parse and inspect URL components</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('url-parser');
  

  const input = $('#input');
  const output = $('#output');
  const err = $('#error');
  
  $('#btn-process').onclick = () => {
    err.textContent = '';
    try {
      let v = input.value.trim();
      if(!v.startsWith('http')) v = 'http://' + v;
      const u = new URL(v);
      let res = `Protocol: ${u.protocol}\nHost:     ${u.host}\nPort:     ${u.port}\nPath:     ${u.pathname}\nSearch:   ${u.search}\nHash:     ${u.hash}\n\nQuery Params:\n`;
      u.searchParams.forEach((val, key) => res += `  ${key} = ${val}\n`);
      output.value = res;
    } catch(e) { err.textContent = 'Invalid URL'; }
  };
  $('#btn-clear').onclick = () => { input.value = output.value = err.textContent = ''; input.focus(); };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
