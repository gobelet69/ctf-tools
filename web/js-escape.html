<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JavaScript Escape / Unescape - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>JavaScript Escape / Unescape</h1>
<p class="note">Escape and unescape JS strings</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('js-escape');
  

  const input = $('#input');
  const output = $('#output');
  const tb = $$('.toolbar')[0];
  tb.innerHTML = '';
  const encBtn = makeEl('button', {class:'primary'}, 'Escape');
  const decBtn = makeEl('button', {}, 'Unescape');
  tb.appendChild(encBtn); tb.appendChild(decBtn);
  
  encBtn.onclick = () => {
    output.value = input.value.replace(/[\"\'\\\n\r\t\u2028\u2029]/g, c => {
      switch(c) {
        case '"': return '\\"'; case "'": return "\\'"; case '\\': return '\\\\';
        case '\n': return '\\n'; case '\r': return '\\r'; case '\t': return '\\t';
        default: return '\\u' + c.charCodeAt(0).toString(16).padStart(4,'0');
      }
    });
  };
  decBtn.onclick = () => {
    try {
      // safe eval-free unescape
      output.value = input.value.replace(/\\([nrt'"\\]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4})/g, (m, p1) => {
        if(p1==='n') return '\n'; if(p1==='r') return '\r'; if(p1==='t') return '\t';
        if(p1==="'") return "'"; if(p1==='"') return '"'; if(p1==='\\') return '\\';
        if(p1[0]==='x' || p1[0]==='u') return String.fromCharCode(parseInt(p1.substring(1), 16));
        return m;
      });
      $('#error').textContent = '';
    } catch(e) { $('#error').textContent = 'Error'; }
  };
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
