<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CORS Header Explainer - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>CORS Header Explainer</h1>
<p class="note">Explain CORS headers and their effects</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('cors-explainer');
  

  const input = $('#input');
  input.placeholder = "Paste HTTP Response Headers...";
  const output = $('#output');
  $('#btn-process').onclick = () => {
    const text = input.value;
    let res = '';
    
    const ao = text.match(/Access-Control-Allow-Origin:\s*(.+)/i);
    if(ao) res += `[ Allow-Origin ]\n${ao[1]}\n-> Determines which origins can read the response. '*' means any origin.\n\n`;
    
    const am = text.match(/Access-Control-Allow-Methods:\s*(.+)/i);
    if(am) res += `[ Allow-Methods ]\n${am[1]}\n-> Which HTTP methods are allowed during preflight.\n\n`;
    
    const ac = text.match(/Access-Control-Allow-Credentials:\s*(.+)/i);
    if(ac) res += `[ Allow-Credentials ]\n${ac[1]}\n-> If true, cookies/auth headers are exposed to the frontend.\n\n`;
    
    const ah = text.match(/Access-Control-Allow-Headers:\s*(.+)/i);
    if(ah) res += `[ Allow-Headers ]\n${ah[1]}\n-> Which custom headers can be sent.\n\n`;
    
    output.value = res || 'No standard CORS headers found in input.';
  };
  $('#btn-clear').onclick = () => { input.value = output.value = ''; };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
