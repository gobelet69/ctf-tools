<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON Formatter - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>JSON Formatter</h1>
<p class="note">Format, minify, and validate JSON</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('json-formatter');
  

  const input = $('#input');
  const output = $('#output');
  const err = $('#error');
  
  const tb = $$('.toolbar')[0];
  tb.innerHTML = '';
  const fmtBtn = makeEl('button', {class: 'primary'}, 'Format');
  const minBtn = makeEl('button', {}, 'Minify');
  const clrBtn = makeEl('button', {}, 'Clear');
  tb.appendChild(fmtBtn); tb.appendChild(minBtn); tb.appendChild(clrBtn);
  
  fmtBtn.onclick = () => {
    err.textContent = '';
    try { output.value = JSON.stringify(JSON.parse(input.value), null, 2); }
    catch(e) { err.textContent = 'Invalid JSON: ' + e.message; }
  };
  
  minBtn.onclick = () => {
    err.textContent = '';
    try { output.value = JSON.stringify(JSON.parse(input.value)); }
    catch(e) { err.textContent = 'Invalid JSON: ' + e.message; }
  };
  
  clrBtn.onclick = () => { input.value = output.value = err.textContent = ''; input.focus(); };
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = err.textContent = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
