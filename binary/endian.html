<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Endianness Converter - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Endianness Converter</h1>
<p class="note">Swap byte order of hex string</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('endian');
  

  const input = $('#input');
  const output = $('#output');
  
  $('#btn-process').onclick = () => {
    const h = input.value.replace(/\s+/g, '');
    if(h.length % 2 !== 0) { $('#error').textContent = 'Odd length hex'; return; }
    let res = '';
    for(let i=h.length-2; i>=0; i-=2) res += h.substr(i, 2);
    output.value = res;
    $('#error').textContent = '';
  };
  $('#btn-clear').onclick = () => { input.value = output.value = $('#error').textContent = ''; input.focus(); };
  $('#btn-swap').onclick = () => { if(output.value) { input.value = output.value; output.value = ''; } };
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
