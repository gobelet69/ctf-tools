<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cyclic Pattern - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>Cyclic Pattern</h1>
<p class="note">Generate and find offsets (pwntools style)</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label>Generate Pattern</label>
    <input type="number" id="len" placeholder="Length" value="100" style="margin-bottom:1rem">
    <button id="btn-gen" class="primary">Generate</button>
    
    <label style="margin-top:2rem">Find Offset</label>
    <input type="text" id="val" placeholder="e.g. 0x61616162 or baaa" style="margin-bottom:1rem">
    <button id="btn-find" class="primary">Find Offset</button>
    <div id="error" class="error"></div>
  </div>
  <div>
    <label>Output</label>
    <textarea id="output" rows="10" readonly></textarea>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('cyclic-pattern');
  

  // simple de Bruijn pattern generator for alphabet a-z
  function cyclic(length) {
    let res = '';
    let a=0, b=0, c=0, d=0;
    for(let i=0; i<length; i++) {
      res += String.fromCharCode(97 + a);
      if(++a > 25) { a = 0; if(++b > 25) { b = 0; if(++c > 25) { c = 0; d++; } } }
    }
    // real pwntools is a de Bruijn sequence, this is a simplified 4-byte unique cyclic pattern often sufficient
    // Actually pwntools does: aaaa, baaa, caaa... let's just do a simple repeating sequence for CTF triage
    // Wait, let's implement the standard one: 
    res = '';
    let chars = "abcdefghijklmnopqrstuvwxyz";
    for(let i1=0; i1<26; i1++) {
      for(let i2=0; i2<26; i2++) {
        for(let i3=0; i3<26; i3++) {
          for(let i4=0; i4<26; i4++) {
            res += chars[i1]+chars[i2]+chars[i3]+chars[i4];
            if(res.length >= length) return res.substring(0, length);
          }
        }
      }
    }
    return res;
  }
  
  const MAX_GEN = 26*26*26*26*4; // 1,827,904
  const FULL = cyclic(MAX_GEN);
  
  $('#btn-gen').onclick = () => {
    $('#error').textContent = '';
    const l = parseInt($('#len').value);
    $('#output').value = cyclic(l);
  };
  
  $('#btn-find').onclick = () => {
    $('#error').textContent = '';
    let v = $('#val').value.trim();
    if(v.startsWith('0x')) {
      // hex little endian to ascii
      const b = hexToBytes(v.substring(2));
      v = Array.from(b).reverse().map(x => String.fromCharCode(x)).join('');
    }
    const idx = FULL.indexOf(v);
    if(idx === -1) $('#output').value = 'Not found';
    else $('#output').value = `Offset: ${idx}`;
  };

</script>
</body>
</html>
