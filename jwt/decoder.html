<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JWT Decoder - CTF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav>
  <a href="../index.html">&larr; Back to Tools</a>
</nav>

<h1>JWT Decoder</h1>
<p class="note">Decode JWT parts (Decoded does not mean verified!)</p>


<div class="grid grid-2" style="margin-top: 1rem;">
  <div>
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Enter input here..."></textarea>
    
    <div class="toolbar">
      <button id="btn-process" class="primary">Process</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  
  <div>
    <label for="output">Output</label>
    <textarea id="output" rows="8" readonly></textarea>
    
    <div class="toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-swap">Output &rarr; Input</button>
    </div>
  </div>
</div>


<script src="../js/common.js"></script>
<script>
  trackUsage('jwt-decoder');
  

  const input = $('#input');
  input.placeholder = "ey...";
  const output = $('#output');
  const err = $('#error');
  
  $('#btn-process').onclick = () => {
    err.textContent = '';
    const parts = input.value.trim().split('.');
    if(parts.length < 2) { err.textContent = 'Invalid JWT'; return; }
    
    try {
      const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
      const header = JSON.stringify(JSON.parse(b64d(parts[0])), null, 2);
      const payload = JSON.stringify(JSON.parse(b64d(parts[1])), null, 2);
      output.value = `[ HEADER ]\n${header}\n\n[ PAYLOAD ]\n${payload}\n\n[ SIGNATURE ]\n${parts[2] || 'none'}\n\n⚠️ DECODED DOES NOT MEAN VERIFIED`;
    } catch(e) { err.textContent = 'Error decoding token'; }
  };
  $('#btn-clear').onclick = () => { input.value = output.value = err.textContent = ''; input.focus(); };
  $('#btn-swap').style.display = 'none';
  addCopyButton($('#btn-copy'), () => output.value);

</script>
</body>
</html>
